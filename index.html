<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Satisfying Breakout</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#161616">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Breakout">
<style>
html,body{margin:0;height:100%;background:#0d0d0d;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{display:flex;align-items:center;justify-content:center}
#wrap{position:relative;display:flex;flex-direction:column;border-radius:18px;overflow:hidden;background:#161616;box-shadow:0 0 0 6px #2c2c2c,0 10px 40px #000}
canvas{display:block;touch-action:none}
#stage{position:relative}
#bar{display:flex;gap:8px;justify-content:space-between;align-items:center;height:38px;padding:0 8px;background:#202020}
#bar button{height:28px;border-radius:14px;border:0;background:#333;color:#fff;font:12px/28px system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;padding:0 10px;cursor:pointer}
#bar #pause{width:40px;padding:0;font-size:14px}
#bar button.armed{background:#d8742b}
#bar #mute{width:34px;padding:0;font-size:15px}
#suck.off{color:#999}
#share{position:absolute;left:50%;transform:translateX(-50%);top:67.5%;display:none;height:34px;border-radius:17px;border:0;background:#1d9bf0;color:#fff;font:bold 13px/34px system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;padding:0 18px;cursor:pointer}
#cont,#next,#again{position:absolute;left:50%;transform:translateX(-50%);display:none;width:62%;height:38px;border-radius:19px;border:0;font:bold 14px/38px system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;cursor:pointer;color:#fff}
#cont{top:41%;background:#ff6b4a}
#next{top:49.5%;background:#2f7fd8}
#again{top:58%;background:#3a3a3a}
#toast{position:absolute;left:50%;transform:translateX(-50%);bottom:64px;max-width:86%;background:rgba(0,0,0,.85);color:#fff;font:12px/1.5 system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;padding:8px 14px;border-radius:12px;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none}
</style>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <button id="suck" title="吸引 (F)">🧲 吸引 ON</button>
    <button id="pause" title="一時停止 (P)">⏸</button>
    <button id="skip" title="次のステージへ">⏭ 次の面</button>
    <button id="mute" title="Sound (M)">🔊</button>
  </div>
  <div id="stage">
    <canvas id="c"></canvas>
    <button id="share" title="Xに投稿">𝕏 に投稿</button>
    <button id="cont">▶ コンティニュー</button>
    <button id="next">⏭ 次のステージへ</button>
    <button id="again">最初から</button>
    <div id="toast"></div>
  </div>
</div>
<script>
(() => {
'use strict';
// ---------- constants ----------
const VERSION = '2026-10-22 e';
const W = 270, H = 500;           // logical size
const C = 5, COLS = 54, ROWS = 56; // 5px cells
const OX = 0, OY = 22;             // field origin
const FIELD_BOTTOM = OY + ROWS * C;
const PADDLE_Y = 452, PH = 6, DEAD_Y = 488;
const R = 2.3;                     // ball radius
const TUBE_TOP = 42;               // default channel top row
const MAXB = 400;
const ORB_R = 7.5;
const ORANGE = '#ff6b4a';
const FONT = '"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const wrap = document.getElementById('wrap');
const muteBtn = document.getElementById('mute');
const suckBtn = document.getElementById('suck');
const shareBtn = document.getElementById('share');
const contBtn = document.getElementById('cont');
const againBtn = document.getElementById('again');
const nextBtn = document.getElementById('next');
const skipBtn = document.getElementById('skip');
const pauseBtn = document.getElementById('pause');
const field = document.createElement('canvas');
const fctx = field.getContext('2d');
let scale = 1;

// ---------- audio ----------
let ac = null, master = null, muted = false;
try { muted = localStorage.getItem('sb-muted') === '1'; } catch (e) {}
muteBtn.textContent = muted ? '🔇' : '🔊';
function initAudio() {
  if (!ac) {
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = 0.8;
      const comp = ac.createDynamicsCompressor(); master.connect(comp); comp.connect(ac.destination);
    } catch (e) { ac = null; }
  }
  if (ac && ac.state === 'suspended') ac.resume();
}
function tone(f, d, type, v, slide) {
  if (!ac || muted) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + d);
  g.gain.setValueAtTime(v || 0.2, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + d + 0.02);
}
const PENTA = [0, 2, 4, 7, 9];
let combo = 0, lastBreak = 0, lastBlip = 0;
function brickSound() {
  const now = performance.now();
  if (now - lastBreak > 400) combo = 0;
  lastBreak = now; combo++;
  if (now - lastBlip < 16) return;
  lastBlip = now;
  const i = combo % 15;
  const semi = PENTA[i % 5] + 12 * Math.floor(i / 5);
  tone(392 * Math.pow(2, semi / 12), 0.14, 'triangle', 0.32);
}
function paddleSound() { tone(170, 0.12, 'sine', 0.5, 0.5); tone(900, 0.03, 'square', 0.08); }
function orbSound(up) {
  const base = up ? 523 : 262;
  [0, 4, 7, 12].forEach((s, i) => setTimeout(() => tone(base * Math.pow(2, (up ? s : -s) / 12), 0.18, 'triangle', 0.045), i * 55));
}
let lastWall = 0, lastDrop = 0;
function wallSound() {
  const now = performance.now();
  if (now - lastWall < 30) return;
  lastWall = now;
  tone(500 + Math.random() * 100, 0.06, 'square', 0.12);
}
function popSound(n) {
  for (let i = 0; i < Math.min(n, 6); i++) setTimeout(() => tone(280 + i * 90 + Math.random() * 30, 0.09, 'sine', 0.09, 1.7), i * 45);
}
function dropSound() {
  const now = performance.now();
  if (now - lastDrop < 80) return;
  lastDrop = now;
  tone(300, 0.22, 'sine', 0.16, 0.35);
}
function bumperSound() { const now = performance.now(); if (now - (bumperSound.t || 0) < 40) return; bumperSound.t = now; tone(520 + Math.random() * 200, 0.12, 'triangle', 0.22, 1.6); }
function loseSound() { tone(220, 0.35, 'sawtooth', 0.12, 0.3); }
function clearSound() { [0, 4, 7, 12, 16].forEach((s, i) => setTimeout(() => tone(440 * Math.pow(2, s / 12), 0.25, 'triangle', 0.18), i * 90)); }

// ---------- level shapes ----------
const heart = (u, v) => {
  const x = (u - 0.5) * 2.4, y = (0.48 - v) * 2.7;
  const a = x * x + y * y - 1;
  return a * a * a - x * x * y * y * y < 0;
};
const ell = (u, v, cx, cy, rx, ry) => ((u - cx) / rx) ** 2 + ((v - cy) / ry) ** 2 < 1;
const E = (x, y, cx, cy, rx, ry) => ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 < 1;
const RC = (x, y, x0, y0, x1, y1) => x >= x0 && x <= x1 && y >= y0 && y <= y1;
const T = (x, y, ax, ay, bx, by, cx, cy) => {
  const d1 = (x - bx) * (ay - by) - (ax - bx) * (y - by), d2 = (x - cx) * (by - cy) - (bx - cx) * (y - cy), d3 = (x - ax) * (cy - ay) - (cx - ax) * (y - ay);
  return !((d1 < 0 || d2 < 0 || d3 < 0) && (d1 > 0 || d2 > 0 || d3 > 0));
};
// pixel-art helper: quantize to a 25x21 grid over the upper 80% of the field
const px = f => (u, v) => {
  const y = v / 0.8;
  return y < 1 && f((Math.floor(u * 25) + 0.5) / 25, (Math.floor(y * 21) + 0.5) / 21);
};
const INVADER = ['00100000100', '00010001000', '00111111100', '01101110110', '11111111111', '10111111101', '10100000101', '00011011000'];
const SHAPES = [
  (u, v) => (u - 0.5) ** 2 + (v - 0.45) ** 2 < 0.2,                       // circle
  heart,
  // tree-shaped hole carved out of a full field
  (u, v) => !(ell(u, v, 0.5, 0.38, 0.4, 0.3) || ell(u, v, 0.3, 0.5, 0.17, 0.14) ||
    ell(u, v, 0.7, 0.5, 0.17, 0.14) || ell(u, v, 0.5, 0.2, 0.17, 0.12) ||
    (u > 0.46 && u < 0.54 && v > 0.55 && v < 0.9)),
  (u, v) => ((Math.round(u * 50) + Math.round(v * 52)) % 14 + 14) % 14 < 9, // diagonal stripes
  (u, v) => Math.sin(u * 10) + Math.sin(v * 9 + u * 4) + Math.sin((u + v) * 7) > -0.9, // blobs
  (u, v) => Math.abs(u - 0.5) + Math.abs(v - 0.45) < 0.48,                // diamond
  (u, v) => {                                                              // star
    const x = u - 0.5, y = v - 0.47, th = Math.atan2(y, x) + Math.PI / 2, seg = Math.PI * 2 / 5;
    const k = ((th % seg) + seg) % seg, d = Math.min(k, seg - k) / (seg / 2);
    return Math.hypot(x, y) < 0.5 - 0.3 * d;
  },
  (u, v) => { const r = Math.hypot(u - 0.5, v - 0.45); return r < 0.5 && Math.floor(r * 14) % 2 === 0; }, // rings
  (u, v) => (Math.floor(u * 8) + Math.floor(v * 8)) % 2 === 0,             // checker
  (u, v) => {                                                              // smiley
    const x = u - 0.5, y = v - 0.45, r = Math.hypot(x, y);
    if (r > 0.47) return false;
    if (ell(u, v, 0.35, 0.32, 0.06, 0.1) || ell(u, v, 0.65, 0.32, 0.06, 0.1)) return false;
    if (y > 0.04 && r > 0.25 && r < 0.33) return false;
    return true;
  },
  (u, v) => (Math.floor(v * 52 + Math.sin(u * 14) * 5) % 12 + 12) % 12 < 8, // waves
  (u, v) => Math.abs(u - 0.5) < 0.17 || Math.abs(v - 0.42) < 0.17,         // cross
  (u, v) => v < 0.8 && INVADER[Math.floor(v / 0.8 * 8)][Math.min(10, Math.floor(u * 11))] === '1', // invader
  (u, v) => {                                                              // spiral
    const x = u - 0.5, y = v - 0.45, r = Math.hypot(x, y), th = Math.atan2(y, x) / (Math.PI * 2);
    return r < 0.5 && (((r * 9 + th) % 1) + 1) % 1 < 0.55;
  },
  (u, v) => v > Math.abs(u - 0.5) * 1.6 && v < 0.9,                        // pyramid
  (u, v) => Math.floor(Math.max(Math.abs(u - 0.5), Math.abs(v - 0.45)) * 16) % 2 === 0 && Math.max(Math.abs(u - 0.5), Math.abs(v - 0.45)) < 0.5, // nested squares
  // ---- pixel-art animals ----
  px((x, y) => (E(x, y, .5, .62, .4, .34) || T(x, y, .1, .5, .12, .04, .42, .3) || T(x, y, .9, .5, .88, .04, .58, .3)) &&   // cat
    !(E(x, y, .33, .56, .07, .09) || E(x, y, .67, .56, .07, .09) || T(x, y, .43, .65, .57, .65, .5, .73) ||
      RC(x, y, .13, .66, .3, .7) || RC(x, y, .7, .66, .87, .7) || RC(x, y, .13, .75, .3, .79) || RC(x, y, .7, .75, .87, .79))),
  px((x, y) => (E(x, y, .5, .5, .26, .36) || E(x, y, .17, .55, .11, .33) || E(x, y, .83, .55, .11, .33)) &&               // dog
    !(E(x, y, .4, .42, .045, .06) || E(x, y, .6, .42, .045, .06) || E(x, y, .5, .6, .06, .045) ||
      RC(x, y, .49, .64, .51, .76) || (E(x, y, .5, .74, .16, .1) && !E(x, y, .5, .7, .16, .08)) ||
      RC(x, y, .27, .3, .29, .8) || RC(x, y, .71, .3, .73, .8))),
  px((x, y) => (E(x, y, .42, .5, .38, .3) || T(x, y, .72, .5, .98, .18, .98, .82)) &&                                        // fish
    !(E(x, y, .22, .43, .045, .06) || RC(x, y, .56, .32, .58, .68) || RC(x, y, .66, .35, .68, .65))),
  px((x, y) => (E(x, y, .5, .68, .3, .28) || E(x, y, .36, .27, .1, .27) || E(x, y, .64, .27, .1, .27)) &&                    // rabbit
    !(E(x, y, .4, .62, .05, .07) || E(x, y, .6, .62, .05, .07) || T(x, y, .46, .74, .54, .74, .5, .8) ||
      E(x, y, .36, .3, .035, .16) || E(x, y, .64, .3, .035, .16))),
  px((x, y) => (E(x, y, .5, .56, .36, .38) || E(x, y, .2, .2, .13, .15) || E(x, y, .8, .2, .13, .15)) &&                   // bear
    !(E(x, y, .36, .46, .05, .07) || E(x, y, .64, .46, .05, .07) || E(x, y, .5, .62, .06, .05) ||
      RC(x, y, .49, .66, .51, .76) || E(x, y, .2, .2, .05, .06) || E(x, y, .8, .2, .05, .06))),
  px((x, y) => (E(x, y, .27, .33, .25, .3) || E(x, y, .73, .33, .25, .3) || E(x, y, .3, .75, .2, .22) || E(x, y, .7, .75, .2, .22)) && // butterfly
    !(RC(x, y, .47, .05, .53, .98) || E(x, y, .27, .33, .08, .1) || E(x, y, .73, .33, .08, .1))),
  px((x, y) => (E(x, y, .5, .42, .36, .4) || (RC(x, y, .14, .42, .86, .95) && !(E(x, y, .22, .98, .09, .09) || E(x, y, .5, .98, .09, .09) || E(x, y, .78, .98, .09, .09)))) && // ghost
    !(E(x, y, .36, .42, .07, .1) || E(x, y, .64, .42, .07, .1) || E(x, y, .5, .66, .06, .08))),
  px((x, y) => (E(x, y, .5, .45, .48, .42) && y < .6 || RC(x, y, .34, .55, .66, 1)) &&                                      // mushroom
    !(E(x, y, .3, .3, .09, .1) || E(x, y, .7, .35, .08, .1) || E(x, y, .5, .14, .07, .08))),
  px((x, y) => (E(x, y, .42, .58, .34, .28) || E(x, y, .72, .3, .17, .18) || T(x, y, .87, .27, .99, .33, .87, .4) ||             // bird
    T(x, y, .12, .5, .0, .28, .22, .62) || RC(x, y, .36, .8, .41, .98) || RC(x, y, .5, .8, .55, .98)) &&
    !(E(x, y, .75, .26, .035, .045) || (E(x, y, .4, .58, .17, .12) && !E(x, y, .4, .52, .17, .1)))),
  px((x, y) => (E(x, y, .5, .66, .42, .28) || E(x, y, .25, .3, .14, .16) || E(x, y, .75, .3, .14, .16) || E(x, y, .12, .92, .1, .07) || E(x, y, .88, .92, .1, .07)) && // frog
    !(E(x, y, .25, .3, .05, .07) || E(x, y, .75, .3, .05, .07) || (E(x, y, .5, .7, .3, .13) && !E(x, y, .5, .62, .3, .13)))),
  px((x, y) => (E(x, y, .5, .55, .3, .42) || E(x, y, .17, .58, .08, .2) || E(x, y, .83, .58, .08, .2) || E(x, y, .36, .97, .11, .05) || E(x, y, .64, .97, .11, .05)) && // penguin
    !(E(x, y, .5, .72, .13, .19) || E(x, y, .4, .3, .035, .045) || E(x, y, .6, .3, .035, .045) || T(x, y, .44, .36, .56, .36, .5, .43) ||
      RC(x, y, .24, .45, .255, .8) || RC(x, y, .745, .45, .76, .8))),
  px((x, y) => (E(x, y, .45, .5, .3, .25) || E(x, y, .75, .4, .18, .2) || E(x, y, .91, .62, .06, .26) || RC(x, y, .24, .6, .36, .98) || RC(x, y, .52, .6, .64, .98) || E(x, y, .14, .55, .04, .1)) && // elephant
    !(E(x, y, .68, .42, .06, .13) || E(x, y, .82, .33, .025, .035) || RC(x, y, .24, .85, .36, .9) && false)),
  px((x, y) => (E(x, y, .4, .55, .28, .24) || E(x, y, .72, .26, .2, .15) || RC(x, y, .62, .26, .76, .5) || T(x, y, .16, .45, .0, .78, .25, .66) || // dinosaur
    RC(x, y, .3, .7, .42, .98) || RC(x, y, .5, .68, .6, .98) || E(x, y, .6, .58, .06, .06)) &&
    !(E(x, y, .78, .2, .03, .04) || RC(x, y, .86, .31, .96, .33))),
  px((x, y) => (T(x, y, .04, .42, .5, .04, .96, .42) || RC(x, y, .12, .42, .88, .98) || RC(x, y, .68, .08, .8, .3)) &&              // house
    !(RC(x, y, .42, .66, .58, .98) || RC(x, y, .2, .52, .34, .64) || RC(x, y, .66, .52, .8, .64))),
  px((x, y) => ([0, 1, 2, 3, 4, 5].some(k => E(x, y, .5 + .22 * Math.cos(k * 1.047), .36 + .22 * Math.sin(k * 1.047), .14, .14)) ||   // flower
    E(x, y, .5, .36, .16, .16) || RC(x, y, .46, .55, .54, .98) || E(x, y, .66, .8, .13, .06) || E(x, y, .34, .7, .13, .06)) &&
    !E(x, y, .5, .36, .07, .07)),
  px((x, y) => (E(x, y, .5, .42, .16, .4) || T(x, y, .36, .55, .12, .88, .36, .8) || T(x, y, .64, .55, .88, .88, .64, .8) ||     // rocket
    T(x, y, .42, .8, .58, .8, .5, .99)) && !(E(x, y, .5, .34, .07, .09) || RC(x, y, .45, .62, .55, .64))),
  px((x, y) => T(x, y, .46, .05, .46, .66, .1, .66) || T(x, y, .54, .18, .54, .66, .9, .66) ||                                   // sailboat
    T(x, y, .08, .72, .92, .72, .78, .94) || T(x, y, .08, .72, .22, .94, .78, .94)),
  px((x, y) => E(x, y, .45, .5, .4, .45) && !E(x, y, .64, .42, .34, .4)),                                                       // crescent moon
  px((x, y) => E(x, y, .5, .5, .2, .24) || [0, 1, 2, 3, 4, 5, 6, 7].some(k => {                                                // sun
    const a = k * Math.PI / 4, P = (r, da) => [.5 + Math.cos(a + da) * r, .5 + Math.sin(a + da) * r * 1.2];
    const p1 = P(.26, -.25), p2 = P(.26, .25), p3 = P(.5, 0);
    return T(x, y, p1[0], p1[1], p2[0], p2[1], p3[0], p3[1]);
  })),
  px((x, y) => E(x, y, .27, .62, .2, .22) || E(x, y, .5, .45, .25, .32) || E(x, y, .75, .62, .2, .22) || RC(x, y, .2, .62, .8, .84)), // cloud
  px((x, y) => (E(x, y, .5, .45, .47, .44) && y < .5) && !(E(x, y, .2, .5, .1, .08) || E(x, y, .4, .5, .1, .08) || E(x, y, .6, .5, .1, .08) || E(x, y, .8, .5, .1, .08)) ||   // umbrella
    RC(x, y, .47, .45, .53, .86) || (E(x, y, .6, .86, .1, .11) && !E(x, y, .6, .86, .04, .05) && y > .85)),
  px((x, y) => (E(x, y, .34, .6, .3, .36) || E(x, y, .66, .6, .3, .36) || RC(x, y, .47, .1, .53, .3) || E(x, y, .62, .16, .11, .07)) && // apple
    !T(x, y, .5, .3, .4, .2, .6, .2)),
  px((x, y) => (E(x, y, .5, .76, .3, .26) || E(x, y, .5, .38, .2, .22) || RC(x, y, .34, .05, .66, .18) || RC(x, y, .28, .17, .72, .2) ||  // snowman

}
// keep speed constant after a bounce off a bumper / moving bar, and avoid dead-flat paths
function settleBall(b) {
  const m = Math.hypot(b.vx, b.vy) || 1;
  b.vx = b.vx / m * G.speed; b.vy = b.vy / m * G.speed;
  const minV = G.speed * 0.18;
  if (Math.abs(b.vy) < minV) { b.vy = (b.vy < 0 ? -1 : 1) * minV; b.vx = (b.vx < 0 ? -1 : 1) * Math.sqrt(G.speed * G.speed - minV * minV); }
}
// gentle funnel: balls rising toward a channel get sucked onto its axis (toggle with the 🧲 button / F)
function funnel(b, dt) {
  if (b.vy >= 0 || b.y < FIELD_BOTTOM) return;
  let a = null;
  for (const q of G.assist) if (!a || Math.abs(b.x - q.x) < Math.abs(b.x - a.x)) a = q;
  if (!a || b.y - FIELD_BOTTOM > 150 || Math.abs(b.x - a.x) > 100) return;
  // already heading into the entrance? then leave the player's angle alone
  if (!a.ax && Math.abs(b.x + b.vx / -b.vy * (b.y - FIELD_BOTTOM) - a.x) < 8) return;
  const ty = b.y - 40, tx = a.x + a.ax * (FIELD_BOTTOM - ty);
  const cur = Math.atan2(b.vx, -b.vy), want = Math.atan2(tx - b.x, b.y - ty);
  let d = want - cur;
  d = Math.atan2(Math.sin(d), Math.cos(d));
  const th = cur + Math.max(-4 * dt, Math.min(4 * dt, d));
  b.vx = Math.sin(th) * G.speed; b.vy = -Math.cos(th) * G.speed;
}
function stepBall(b, dt) {
  if (G.suction && G.assist.length) funnel(b, dt);
  const dist = G.speed * dt, n = Math.max(1, Math.ceil(dist / 1.2)), st = dt / n;
  for (let i = 0; i < n; i++) {
    b.x += b.vx * st; b.y += b.vy * st;
    if (b.y < FIELD_BOTTOM + R + 1) collideGrid(b);
    if (b.x < R) { b.x = R; b.vx = Math.abs(b.vx); wallSound(); }
    else if (b.x > W - R) { b.x = W - R; b.vx = -Math.abs(b.vx); wallSound(); }
    if (b.y < FIELD_BOTTOM) {
      for (const bp of G.bumpers) {
        const dx = b.x - bp.x, dy = b.y - bp.y, d = Math.hypot(dx, dy), rr = bp.r + R;
        if (d < rr && d > 0) {
          const nx = dx / d, ny = dy / d, dot = b.vx * nx + b.vy * ny;
          if (dot < 0) { b.vx -= 2 * dot * nx; b.vy -= 2 * dot * ny; }
          b.x = bp.x + nx * rr; b.y = bp.y + ny * rr; bp.flash = 1; bumperSound(); settleBall(b);
        }
      }
      for (const m of G.movers) {
        const qx = Math.max(m.x - m.w / 2, Math.min(b.x, m.x + m.w / 2)), qy = Math.max(m.y - m.h / 2, Math.min(b.y, m.y + m.h / 2));
        const dx = b.x - qx, dy = b.y - qy, d2 = dx * dx + dy * dy;
        if (d2 < R * R) {
          const d = Math.sqrt(d2), nx = d > 1e-6 ? dx / d : 0, ny = d > 1e-6 ? dy / d : (b.vy > 0 ? -1 : 1), dot = b.vx * nx + b.vy * ny;
          if (dot < 0) { b.vx -= 2 * dot * nx; b.vy -= 2 * dot * ny; }
          b.x = qx + nx * (R + 0.1); b.y = qy + ny * (R + 0.1); wallSound(); settleBall(b);
        }
      }
    }
    // paddle
    const half = G.pw / 2, top = PADDLE_Y - PH / 2;
    if (b.vy > 0 && b.y + R >= top && b.y - R <= PADDLE_Y + PH / 2 && Math.abs(b.x - G.px) <= half + R) {
      const t = Math.max(-1, Math.min(1, (b.x - G.px) / half)), a = t * 1.0;
      b.vx = Math.sin(a) * G.speed; b.vy = -Math.cos(a) * G.speed;
      b.y = top - R; G.bump = 1; paddleSound();
    }
    if (b.y - R > DEAD_Y) { b.dead = true; return; }
  }
}

// ---------- update ----------
function update(dt) {
  // paddle
  if (G.keys.l) G.target -= 420 * dt;
  if (G.keys.r) G.target += 420 * dt;
  G.target = Math.max(G.pw / 2 + 2, Math.min(W - G.pw / 2 - 2, G.target));
  G.px += (G.target - G.px) * (1 - Math.exp(-dt * 40));
  const wantW = G.pwBase;
  G.pw += (wantW - G.pw) * (1 - Math.exp(-dt * 12));
  G.bump = Math.max(0, G.bump - dt * 8);
  for (const m of G.movers) { m.x += m.vx * dt; if (m.x - m.w / 2 < 8) { m.x = 8 + m.w / 2; m.vx = Math.abs(m.vx); } else if (m.x + m.w / 2 > W - 8) { m.x = W - 8 - m.w / 2; m.vx = -Math.abs(m.vx); } }
  for (const bp of G.bumpers) bp.flash = Math.max(0, bp.flash - dt * 5);
  if (G.pierce > 0) G.pierce = Math.max(0, G.pierce - dt);
  G.shake = Math.max(0, G.shake - dt * 8);

  if (G.state === 'ready') {
    const b = G.balls[0]; b.x = G.px; b.y = PADDLE_Y - PH / 2 - R - 1;
  } else if (G.state === 'play' || G.state === 'clear') {
    for (const b of G.balls) stepBall(b, dt);
    // orbs
    for (const o of G.orbs.slice()) {
      for (const b of G.balls) {
        if (Math.hypot(b.x - o.x, b.y - o.y) < ORB_R + R) { hitOrb(o); break; }
      }
    }
    // falling items: caught by the paddle = activated
    for (let k = G.drops.length - 1; k >= 0; k--) {
      const d = G.drops[k];
      d.vy = Math.min(150, d.vy + 110 * dt); d.y += d.vy * dt;
      if (d.y + ORB_R >= PADDLE_Y - PH / 2 && d.y - ORB_R <= PADDLE_Y + PH / 2 && Math.abs(d.x - G.px) <= G.pw / 2 + ORB_R) {
        G.drops.splice(k, 1); applyOrb(d.type, G.px, PADDLE_Y - 14);
      } else if (d.y - ORB_R > DEAD_Y) G.drops.splice(k, 1);
    }
    const before = G.balls.length;
    G.balls = G.balls.filter(b => !b.dead);
    if (G.balls.length < before) dropSound();
    if (G.state === 'play') {
      if (G.bricks <= 0) {
        G.state = 'clear'; G.timer = 1.8; clearSound();
        addText(W / 2, OY + 110, 'CLEAR!', '#fff', 26, 1.8);
        G.shake = 2;
      } else if (G.balls.length === 0 && before > 0) {
        loseSound();
        G.lives--;
        if (G.lives <= 0) {
          G.state = 'over'; G.overAt = performance.now();
          if (G.score > G.best) { G.best = G.score; try { localStorage.setItem('sb-best', G.best); } catch (e) {} }
        } else {
          G.pwBase = 56; G.pierce = 0; G.drops = [];
          resetBall();
          addText(W / 2, OY + 110, 'MISS', ORANGE, 20, 1.0);
        }
      }
    } else {
      G.timer -= dt;
      if (G.timer <= 0) {
        G.level++; G.pierce = 0; G.pwBase = 56;
        buildLevel(G.level); resetBall();
        addText(W / 2, OY + 100, 'LEVEL ' + (G.level + 1), '#fff', 22, 1.4);
      }
    }
  }
  // particles & texts
  for (let i = G.parts.length - 1; i >= 0; i--) {
    const p = G.parts[i]; p.t += dt;
    if (p.t >= p.life) { G.parts[i] = G.parts[G.parts.length - 1]; G.parts.pop(); continue; }
    p.vy += (p.g || 120) * dt; p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (let i = G.texts.length - 1; i >= 0; i--) {
    const t = G.texts[i]; t.t += dt; t.y -= 12 * dt;
    if (t.t >= t.life) G.texts.splice(i, 1);
  }
}

// ---------- drawing ----------
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
}
function draw(now) {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.fillStyle = '#161616'; ctx.fillRect(0, 0, W, H);
  // header
  ctx.fillStyle = '#343434'; ctx.fillRect(0, 0, W, OY - 4);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 11px ' + FONT; ctx.textBaseline = 'middle';
  ctx.textAlign = 'left'; ctx.fillText('SCORE ' + G.score, 10, 9);
  ctx.textAlign = 'center'; ctx.fillText('LV ' + (G.level + 1), W / 2, 9);
  if (G.pierce > 0) { ctx.fillStyle = '#c9a0ff'; ctx.textAlign = 'center'; ctx.fillText('PIERCE ' + G.pierce.toFixed(1), W * 0.72, 9); ctx.fillStyle = '#fff'; }
  ctx.textAlign = 'right'; ctx.fillText('♥'.repeat(Math.max(0, G.lives)), W - 10, 9);

  const sx = (Math.random() - 0.5) * G.shake, sy = (Math.random() - 0.5) * G.shake;
  ctx.save(); ctx.translate(sx, sy);
  ctx.drawImage(field, 0, 0, field.width, field.height, OX, OY, W, ROWS * C);

  // orbs
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const o of G.orbs) {
    const d = ORB[o.type], p = 1 + Math.sin(now / 250 + o.ph) * 0.06;
    ctx.fillStyle = d.col; ctx.beginPath(); ctx.arc(o.x, o.y, ORB_R * p, 0, 6.283); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 9px ' + FONT; ctx.fillText(d.txt, o.x, o.y + 0.5);
  }
  // bumpers and shuttling bars
  for (const bp of G.bumpers) {
    ctx.fillStyle = '#f2f2f2'; ctx.beginPath(); ctx.arc(bp.x, bp.y, bp.r + bp.flash * 1.5, 0, 6.283); ctx.fill();
    ctx.fillStyle = bp.flash > 0.3 ? '#ffd21a' : G.pal.fill; ctx.beginPath(); ctx.arc(bp.x, bp.y, bp.r * 0.55, 0, 6.283); ctx.fill();
  }
  for (const m of G.movers) { ctx.fillStyle = '#d9d9d9'; rrect(m.x - m.w / 2, m.y - m.h / 2, m.w, m.h, 2.5); ctx.fill(); }
  // falling items
  for (const d of G.drops) {
    const c = ORB[d.type];
    ctx.globalAlpha = 0.25; ctx.fillStyle = c.col; ctx.beginPath(); ctx.arc(d.x, d.y - 8, ORB_R * 0.8, 0, 6.283); ctx.fill();
    ctx.globalAlpha = 1; ctx.fillStyle = c.col; ctx.beginPath(); ctx.arc(d.x, d.y, ORB_R, 0, 6.283); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 9px ' + FONT; ctx.fillText(c.txt, d.x, d.y + 0.5);
  }
  // particles
  for (const p of G.parts) {
    ctx.globalAlpha = 1 - p.t / p.life; ctx.fillStyle = p.col; ctx.fillRect(p.x, p.y, p.sz, p.sz);
  }
  ctx.globalAlpha = 1;
  // bottom line
  ctx.fillStyle = ORANGE; ctx.fillRect(0, DEAD_Y + 2, W, 6);
  // paddle
  const pw = G.pw, ph = PH + G.bump * 2;
  ctx.fillStyle = G.pwBase > 60 ? '#ff8fbf' : G.pwBase < 52 ? '#c9452b' : ORANGE;
  rrect(G.px - pw / 2, PADDLE_Y - ph / 2, pw, ph, 3); ctx.fill();
  // balls
  ctx.fillStyle = G.pierce > 0 ? '#e0c8ff' : '#fff'; ctx.beginPath();
  for (const b of G.balls) { ctx.moveTo(b.x + R, b.y); ctx.arc(b.x, b.y, R, 0, 6.283); }
  ctx.fill();
  // texts
  for (const t of G.texts) {
    ctx.globalAlpha = Math.min(1, (t.life - t.t) * 2.5);
    ctx.fillStyle = t.color; ctx.font = 'bold ' + t.size + 'px ' + FONT; ctx.textAlign = 'center';
    ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.font = '8px ' + FONT; ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic'; ctx.fillText('v' + VERSION, W - 4, H - 2);
  if (G.paused) {
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 30px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('PAUSE', W / 2, 210);
    ctx.font = '13px ' + FONT; ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.fillText('上の ▶ ボタン（Pキー）で再開', W / 2, 250);
  }
  // overlays
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (G.state === 'ready' && G.hint) {
    ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.font = '12px ' + FONT;
    ctx.fillText('ドラッグでパドル移動 / タップで発射', W / 2, 395);
    ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.font = '10px ' + FONT;
    ctx.fillText('ボールは通路から上へ / 落ちるアイテムをパドルで拾おう', W / 2, 412);
  }
  if (G.state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,.78)'; ctx.fillRect(0, 130, W, 215);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 26px ' + FONT; ctx.fillText('GAME OVER', W / 2, 160);
    ctx.font = '13px ' + FONT; ctx.fillText('SCORE ' + G.score + '   BEST ' + G.best, W / 2, 190);
  }
}

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  if (!G.paused) update(dt);
  draw(now);
  const over = G.state === 'over' ? 'block' : 'none';
  if (contBtn.style.display !== over) { contBtn.style.display = over; nextBtn.style.display = over; againBtn.style.display = over; }
  // the share button only appears on the game-over screen, a moment after it, so it can't be hit by accident while playing
  if (G.state === 'over' && !G.shot && !G.shooting && now - G.overAt > 400) {
    G.shooting = true; cv.toBlob(bl => { G.shot = bl; G.shooting = false; }, 'image/png');
  }
  if (G.state !== 'over') G.shot = null;
  const sh = G.state === 'over' && now - G.overAt > 800 ? 'block' : 'none';
  if (shareBtn.style.display !== sh) shareBtn.style.display = sh;
  requestAnimationFrame(frame);
}

// ---------- input ----------
function pointerX(e) {
  const r = cv.getBoundingClientRect();
  return (e.clientX - r.left) / r.width * W;
}
cv.addEventListener('pointermove', e => { G.target = pointerX(e); });
cv.addEventListener('pointerdown', e => {
  initAudio();
  if (G.paused) return;
  G.target = pointerX(e);
  if (G.state === 'ready') launch();
  else if (G.state === 'over' && performance.now() - G.overAt > 800) newGame();
});
['touchstart', 'click'].forEach(ev => window.addEventListener(ev, initAudio, { passive: true }));
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') G.keys.l = true;
  else if (e.key === 'ArrowRight' || e.key === 'd') G.keys.r = true;
  else if (e.key === ' ' || e.key === 'Enter') {
    initAudio(); e.preventDefault();
    if (G.paused) return;
    if (G.state === 'ready') launch(); else if (G.state === 'over' && performance.now() - G.overAt > 500) continueGame();
  } else if (e.key === 'm') toggleMute();
  else if (e.key === 'r' && G.state === 'over') newGame();
  else if (e.key === 'f') setSuction(!G.suction);
  else if (e.key === 'p' || e.key === 'Escape') setPause(!G.paused);
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') G.keys.l = false;
  else if (e.key === 'ArrowRight' || e.key === 'd') G.keys.r = false;
});
// continue from the same stage: bricks stay as they are, lives are refilled, score is kept
function continueGame() {
  if (G.state !== 'over') return;
  G.lives = 3; G.pwBase = 56; G.pierce = 0; G.drops = [];
  resetBall();
  addText(W / 2, OY + 110, 'CONTINUE', '#fff', 20, 1.2);
}
// skip ahead: give up on this stage and start the next one with fresh lives (score is kept)
function nextStage() {
  const wasOver = G.state === 'over';
  G.level++; if (wasOver) G.lives = 3; G.pwBase = 56; G.pierce = 0; G.drops = [];
  buildLevel(G.level); resetBall();
  addText(W / 2, OY + 100, 'LEVEL ' + (G.level + 1), '#fff', 22, 1.4);
}
nextBtn.addEventListener('pointerdown', e => { e.stopPropagation(); initAudio(); nextStage(); });
// the toolbar button is on top, away from the paddle, and needs a second tap to confirm
skipBtn.addEventListener('click', () => {
  initAudio();
  if (skipBtn.classList.contains('armed')) { clearTimeout(skipBtn.t); skipBtn.classList.remove('armed'); skipBtn.textContent = '⏭ 次の面'; nextStage(); return; }
  skipBtn.classList.add('armed'); skipBtn.textContent = 'もう一度で次の面へ';
  skipBtn.t = setTimeout(() => { skipBtn.classList.remove('armed'); skipBtn.textContent = '⏭ 次の面'; }, 2200);
});
contBtn.addEventListener('pointerdown', e => { e.stopPropagation(); initAudio(); continueGame(); });
againBtn.addEventListener('pointerdown', e => { e.stopPropagation(); initAudio(); if (G.state === 'over') newGame(); });
function setSuction(on) {
  G.suction = on; suckBtn.textContent = '🧲 吸引 ' + (on ? 'ON' : 'OFF'); suckBtn.classList.toggle('off', !on);
  try { localStorage.setItem('sb-suction', on ? '1' : '0'); } catch (e) {}
}
try { if (localStorage.getItem('sb-suction') === '0') setSuction(false); } catch (e) {}
suckBtn.addEventListener('pointerdown', e => { e.stopPropagation(); setSuction(!G.suction); });
shareBtn.addEventListener('pointerdown', e => e.stopPropagation());
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.opacity = 1;
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.style.opacity = 0; }, 3500);
}
// share the final screen: the screenshot is taken when the game-over screen appears, so the click can hand it to the OS share sheet right away
// (mobile: share sheet with the image attached; PC: image goes to the clipboard / is saved, then the X compose window opens)
async function fallbackShare(blob, href) {
  let copied = false;
  try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]); copied = true; } catch (e) {}
  if (!copied) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'satisfying-breakout.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }
  toast(copied ? '画像をコピーしました。投稿画面で貼り付けてください' : '画像を保存しました。投稿画面で添付してください');
  window.open(href, '_blank', 'noopener');
}
shareBtn.addEventListener('click', async () => {
  const best = Math.max(G.best, G.score);
  const text = 'Satisfying Breakout で ' + G.score + '点（LV' + (G.level + 1) + '）！ベスト ' + best + '点 #SatisfyingBreakout';
  const url = location.origin + location.pathname;
  const href = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(url);
  let blob = G.shot;
  if (!blob) { try { blob = await new Promise(res => cv.toBlob(res, 'image/png')); } catch (e) {} }
  if (!blob) { window.open(href, '_blank', 'noopener'); return; }
  const file = new File([blob], 'satisfying-breakout.png', { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], text, url }).catch(e => { if (!e || e.name !== 'AbortError') fallbackShare(blob, href); });
    return;
  }
  fallbackShare(blob, href);
});


function setPause(on) {
  if (on && G.state === 'over') return;
  G.paused = on; pauseBtn.textContent = on ? '▶' : '⏸'; pauseBtn.classList.toggle('armed', on);
  if (on) { G.keys.l = G.keys.r = false; }
}
pauseBtn.addEventListener('click', () => { initAudio(); setPause(!G.paused); });
document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'play') setPause(true); });
function toggleMute() {
  muted = !muted; muteBtn.textContent = muted ? '🔇' : '🔊';
  try { localStorage.setItem('sb-muted', muted ? '1' : '0'); } catch (e) {}
}
muteBtn.addEventListener('pointerdown', e => { e.stopPropagation(); initAudio(); toggleMute(); });

// offline play: the service worker caches the game after the first visit
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {   // a newer version took over: reload once (never in the middle of a round)
    if (hadController && !window.__swReloaded && G.state !== 'play') { window.__swReloaded = true; location.reload(); }
  });
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').then(reg => reg.update()).catch(() => {}); });
}
resize();
newGame();
requestAnimationFrame(frame);
})();
</script>
