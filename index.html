<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Satisfying Breakout</title>
<style>
html,body{margin:0;height:100%;background:#0d0d0d;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{display:flex;align-items:center;justify-content:center}
#wrap{position:relative;border-radius:18px;overflow:hidden;background:#161616;box-shadow:0 0 0 6px #2c2c2c,0 10px 40px #000}
canvas{display:block;touch-action:none}
#suck{position:absolute;left:10px;bottom:10px;height:34px;border-radius:17px;border:0;background:#262626;color:#fff;font:12px/34px system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;padding:0 12px;cursor:pointer;opacity:.85}
#suck.off{color:#888}
#mute{position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:50%;border:0;background:#262626;color:#fff;font-size:16px;line-height:34px;padding:0;cursor:pointer;opacity:.85}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <button id="suck" title="吸引 (F)">🧲 吸引 ON</button>
  <button id="mute" title="Sound (M)">🔊</button>
</div>
<script>
(() => {
'use strict';
// ---------- constants ----------
const W = 270, H = 500;           // logical size
const C = 5, COLS = 54, ROWS = 56; // 5px cells
const OX = 0, OY = 22;             // field origin
const FIELD_BOTTOM = OY + ROWS * C;
const PADDLE_Y = 452, PH = 6, DEAD_Y = 488;
const R = 2.3;                     // ball radius
const TUBE_TOP = 42;               // default channel top row
const MAXB = 400;
const ORB_R = 7.5;
const ORANGE = '#ff6b4a';
const FONT = '"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const wrap = document.getElementById('wrap');
const muteBtn = document.getElementById('mute');
const suckBtn = document.getElementById('suck');
const field = document.createElement('canvas');
const fctx = field.getContext('2d');
let scale = 1;

// ---------- audio ----------
let ac = null, master = null, muted = false;
try { muted = localStorage.getItem('sb-muted') === '1'; } catch (e) {}
muteBtn.textContent = muted ? '🔇' : '🔊';
function initAudio() {
  if (!ac) {
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = 0.8;
      const comp = ac.createDynamicsCompressor(); master.connect(comp); comp.connect(ac.destination);
    } catch (e) { ac = null; }
  }
  if (ac && ac.state === 'suspended') ac.resume();
}
function tone(f, d, type, v, slide) {
  if (!ac || muted) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + d);
  g.gain.setValueAtTime(v || 0.2, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + d + 0.02);
}
const PENTA = [0, 2, 4, 7, 9];
let combo = 0, lastBreak = 0, lastBlip = 0;
function brickSound() {
  const now = performance.now();
  if (now - lastBreak > 400) combo = 0;
  lastBreak = now; combo++;
  if (now - lastBlip < 16) return;
  lastBlip = now;
  const i = combo % 15;
  const semi = PENTA[i % 5] + 12 * Math.floor(i / 5);
  tone(392 * Math.pow(2, semi / 12), 0.14, 'triangle', 0.32);
}
function paddleSound() { tone(170, 0.12, 'sine', 0.5, 0.5); tone(900, 0.03, 'square', 0.08); }
function orbSound(up) {
  const base = up ? 523 : 262;
  [0, 4, 7, 12].forEach((s, i) => setTimeout(() => tone(base * Math.pow(2, (up ? s : -s) / 12), 0.18, 'triangle', 0.045), i * 55));
}
let lastWall = 0, lastDrop = 0;
function wallSound() {
  const now = performance.now();
  if (now - lastWall < 30) return;
  lastWall = now;
  tone(500 + Math.random() * 100, 0.06, 'square', 0.12);
}
function popSound(n) {
  for (let i = 0; i < Math.min(n, 6); i++) setTimeout(() => tone(280 + i * 90 + Math.random() * 30, 0.09, 'sine', 0.09, 1.7), i * 45);
}
function dropSound() {
  const now = performance.now();
  if (now - lastDrop < 80) return;
  lastDrop = now;
  tone(300, 0.22, 'sine', 0.16, 0.35);
}
function loseSound() { tone(220, 0.35, 'sawtooth', 0.12, 0.3); }
function clearSound() { [0, 4, 7, 12, 16].forEach((s, i) => setTimeout(() => tone(440 * Math.pow(2, s / 12), 0.25, 'triangle', 0.18), i * 90)); }

// ---------- level shapes ----------
const heart = (u, v) => {
  const x = (u - 0.5) * 2.4, y = (0.48 - v) * 2.7;
  const a = x * x + y * y - 1;
  return a * a * a - x * x * y * y * y < 0;
};
const ell = (u, v, cx, cy, rx, ry) => ((u - cx) / rx) ** 2 + ((v - cy) / ry) ** 2 < 1;
const E = (x, y, cx, cy, rx, ry) => ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 < 1;
const RC = (x, y, x0, y0, x1, y1) => x >= x0 && x <= x1 && y >= y0 && y <= y1;
const T = (x, y, ax, ay, bx, by, cx, cy) => {
  const d1 = (x - bx) * (ay - by) - (ax - bx) * (y - by), d2 = (x - cx) * (by - cy) - (bx - cx) * (y - cy), d3 = (x - ax) * (cy - ay) - (cx - ax) * (y - ay);
  return !((d1 < 0 || d2 < 0 || d3 < 0) && (d1 > 0 || d2 > 0 || d3 > 0));
};
// pixel-art helper: quantize to a 25x21 grid over the upper 80% of the field
const px = f => (u, v) => {
  const y = v / 0.8;
  return y < 1 && f((Math.floor(u * 25) + 0.5) / 25, (Math.floor(y * 21) + 0.5) / 21);
};
const INVADER = ['00100000100', '00010001000', '00111111100', '01101110110', '11111111111', '10111111101', '10100000101', '00011011000'];
const SHAPES = [
  (u, v) => (u - 0.5) ** 2 + (v - 0.45) ** 2 < 0.2,                       // circle
  heart,
  // tree-shaped hole carved out of a full field
  (u, v) => !(ell(u, v, 0.5, 0.38, 0.4, 0.3) || ell(u, v, 0.3, 0.5, 0.17, 0.14) ||
    ell(u, v, 0.7, 0.5, 0.17, 0.14) || ell(u, v, 0.5, 0.2, 0.17, 0.12) ||
    (u > 0.46 && u < 0.54 && v > 0.55 && v < 0.9)),
  (u, v) => ((Math.round(u * 50) + Math.round(v * 52)) % 14 + 14) % 14 < 9, // diagonal stripes
  (u, v) => Math.sin(u * 10) + Math.sin(v * 9 + u * 4) + Math.sin((u + v) * 7) > -0.9, // blobs
  (u, v) => Math.abs(u - 0.5) + Math.abs(v - 0.45) < 0.48,                // diamond
  (u, v) => {                                                              // star
    const x = u - 0.5, y = v - 0.47, th = Math.atan2(y, x) + Math.PI / 2, seg = Math.PI * 2 / 5;
    const k = ((th % seg) + seg) % seg, d = Math.min(k, seg - k) / (seg / 2);
    return Math.hypot(x, y) < 0.5 - 0.3 * d;
  },
  (u, v) => { const r = Math.hypot(u - 0.5, v - 0.45); return r < 0.5 && Math.floor(r * 14) % 2 === 0; }, // rings
  (u, v) => (Math.floor(u * 8) + Math.floor(v * 8)) % 2 === 0,             // checker
  (u, v) => {                                                              // smiley
    const x = u - 0.5, y = v - 0.45, r = Math.hypot(x, y);
    if (r > 0.47) return false;
    if (ell(u, v, 0.35, 0.32, 0.06, 0.1) || ell(u, v, 0.65, 0.32, 0.06, 0.1)) return false;
    if (y > 0.04 && r > 0.25 && r < 0.33) return false;
    return true;
  },
  (u, v) => (Math.floor(v * 52 + Math.sin(u * 14) * 5) % 12 + 12) % 12 < 8, // waves
  (u, v) => Math.abs(u - 0.5) < 0.17 || Math.abs(v - 0.42) < 0.17,         // cross
  (u, v) => v < 0.8 && INVADER[Math.floor(v / 0.8 * 8)][Math.min(10, Math.floor(u * 11))] === '1', // invader
  (u, v) => {                                                              // spiral
    const x = u - 0.5, y = v - 0.45, r = Math.hypot(x, y), th = Math.atan2(y, x) / (Math.PI * 2);
    return r < 0.5 && (((r * 9 + th) % 1) + 1) % 1 < 0.55;
  },
  (u, v) => v > Math.abs(u - 0.5) * 1.6 && v < 0.9,                        // pyramid
  (u, v) => Math.floor(Math.max(Math.abs(u - 0.5), Math.abs(v - 0.45)) * 16) % 2 === 0 && Math.max(Math.abs(u - 0.5), Math.abs(v - 0.45)) < 0.5, // nested squares
  // ---- pixel-art animals ----
  px((x, y) => (E(x, y, .5, .62, .4, .34) || T(x, y, .1, .5, .12, .04, .42, .3) || T(x, y, .9, .5, .88, .04, .58, .3)) &&   // cat
    !(E(x, y, .33, .56, .07, .09) || E(x, y, .67, .56, .07, .09) || T(x, y, .43, .65, .57, .65, .5, .73) ||
      RC(x, y, .13, .66, .3, .7) || RC(x, y, .7, .66, .87, .7) || RC(x, y, .13, .75, .3, .79) || RC(x, y, .7, .75, .87, .79))),
  px((x, y) => (E(x, y, .5, .5, .26, .36) || E(x, y, .17, .55, .11, .33) || E(x, y, .83, .55, .11, .33)) &&               // dog
    !(E(x, y, .4, .42, .045, .06) || E(x, y, .6, .42, .045, .06) || E(x, y, .5, .6, .06, .045) ||
      RC(x, y, .49, .64, .51, .76) || (E(x, y, .5, .74, .16, .1) && !E(x, y, .5, .7, .16, .08)) ||
      RC(x, y, .27, .3, .29, .8) || RC(x, y, .71, .3, .73, .8))),
  px((x, y) => (E(x, y, .42, .5, .38, .3) || T(x, y, .72, .5, .98, .18, .98, .82)) &&                                        // fish
    !(E(x, y, .22, .43, .045, .06) || RC(x, y, .56, .32, .58, .68) || RC(x, y, .66, .35, .68, .65))),
  px((x, y) => (E(x, y, .5, .68, .3, .28) || E(x, y, .36, .27, .1, .27) || E(x, y, .64, .27, .1, .27)) &&                    // rabbit
    !(E(x, y, .4, .62, .05, .07) || E(x, y, .6, .62, .05, .07) || T(x, y, .46, .74, .54, .74, .5, .8) ||
      E(x, y, .36, .3, .035, .16) || E(x, y, .64, .3, .035, .16))),
  px((x, y) => (E(x, y, .5, .56, .36, .38) || E(x, y, .2, .2, .13, .15) || E(x, y, .8, .2, .13, .15)) &&                   // bear
    !(E(x, y, .36, .46, .05, .07) || E(x, y, .64, .46, .05, .07) || E(x, y, .5, .62, .06, .05) ||
      RC(x, y, .49, .66, .51, .76) || E(x, y, .2, .2, .05, .06) || E(x, y, .8, .2, .05, .06))),
  px((x, y) => (E(x, y, .27, .33, .25, .3) || E(x, y, .73, .33, .25, .3) || E(x, y, .3, .75, .2, .22) || E(x, y, .7, .75, .2, .22)) && // butterfly
    !(RC(x, y, .47, .05, .53, .98) || E(x, y, .27, .33, .08, .1) || E(x, y, .73, .33, .08, .1))),
  px((x, y) => (E(x, y, .5, .42, .36, .4) || (RC(x, y, .14, .42, .86, .95) && !(E(x, y, .22, .98, .09, .09) || E(x, y, .5, .98, .09, .09) || E(x, y, .78, .98, .09, .09)))) && // ghost
    !(E(x, y, .36, .42, .07, .1) || E(x, y, .64, .42, .07, .1) || E(x, y, .5, .66, .06, .08))),
  px((x, y) => (E(x, y, .5, .45, .48, .42) && y < .6 || RC(x, y, .34, .55, .66, 1)) &&                                      // mushroom
    !(E(x, y, .3, .3, .09, .1) || E(x, y, .7, .35, .08, .1) || E(x, y, .5, .14, .07, .08))),
  px((x, y) => (E(x, y, .42, .58, .34, .28) || E(x, y, .72, .3, .17, .18) || T(x, y, .87, .27, .99, .33, .87, .4) ||             // bird
    T(x, y, .12, .5, .0, .28, .22, .62) || RC(x, y, .36, .8, .41, .98) || RC(x, y, .5, .8, .55, .98)) &&
    !(E(x, y, .75, .26, .035, .045) || (E(x, y, .4, .58, .17, .12) && !E(x, y, .4, .52, .17, .1)))),
  px((x, y) => (E(x, y, .5, .66, .42, .28) || E(x, y, .25, .3, .14, .16) || E(x, y, .75, .3, .14, .16) || E(x, y, .12, .92, .1, .07) || E(x, y, .88, .92, .1, .07)) && // frog
    !(E(x, y, .25, .3, .05, .07) || E(x, y, .75, .3, .05, .07) || (E(x, y, .5, .7, .3, .13) && !E(x, y, .5, .62, .3, .13)))),
  px((x, y) => (E(x, y, .5, .55, .3, .42) || E(x, y, .17, .58, .08, .2) || E(x, y, .83, .58, .08, .2) || E(x, y, .36, .97, .11, .05) || E(x, y, .64, .97, .11, .05)) && // penguin
    !(E(x, y, .5, .72, .13, .19) || E(x, y, .4, .3, .035, .045) || E(x, y, .6, .3, .035, .045) || T(x, y, .44, .36, .56, .36, .5, .43) ||
      RC(x, y, .24, .45, .255, .8) || RC(x, y, .745, .45, .76, .8))),
  px((x, y) => (E(x, y, .45, .5, .3, .25) || E(x, y, .75, .4, .18, .2) || E(x, y, .91, .62, .06, .26) || RC(x, y, .24, .6, .36, .98) || RC(x, y, .52, .6, .64, .98) || E(x, y, .14, .55, .04, .1)) && // elephant
    !(E(x, y, .68, .42, .06, .13) || E(x, y, .82, .33, .025, .035) || RC(x, y, .24, .85, .36, .9) && false)),
  px((x, y) => (E(x, y, .4, .55, .28, .24) || E(x, y, .72, .26, .2, .15) || RC(x, y, .62, .26, .76, .5) || T(x, y, .16, .45, .0, .78, .25, .66) || // dinosaur
    RC(x, y, .3, .7, .42, .98) || RC(x, y, .5, .68, .6, .98) || E(x, y, .6, .58, .06, .06)) &&
    !(E(x, y, .78, .2, .03, .04) || RC(x, y, .86, .31, .96, .33)))
];

// ---------- state ----------
const G = {
  state: 'ready', level: 0, score: 0, lives: 3, best: 0,
  bricks: 0, px: W / 2, target: W / 2, pw: 56, pwTimer: 0, pwKind: 0,
  order: [], assist: [], tubes: ['center'], aim: [W / 2], cavs: [[27, 39]], balls: [], orbs: [], parts: [], texts: [], grid: new Uint8Array(COLS * ROWS),
  shake: 0, fail: 0, pierce: 0, bump: 0, timer: 0, speed: 250, keys: { l: false, r: false }, hint: 1, suction: true
};
window.__G = G; // handy for debugging
G.build = n => buildLevel(n); G.update = dt => update(dt); G.launch = () => launch();
try { G.best = +localStorage.getItem('sb-best') || 0; } catch (e) {}

// ---------- field rendering ----------
function drawCell(c, r, t) {
  const fy = r * C, fx = c * C;
  if (t === 1) {
    fctx.fillStyle = '#2b7a13'; fctx.fillRect(fx, fy, C, C);
    fctx.fillStyle = '#48b81d'; fctx.fillRect(fx, fy, C - 1, C - 1);
  } else if (t === 2) {
    fctx.fillStyle = '#4a4a4a'; fctx.fillRect(fx, fy, C, C);
    fctx.fillStyle = '#8c8c8c'; fctx.fillRect(fx, fy, C - 1, C - 1);
  } else {
    fctx.clearRect(fx, fy, C, C);
  }
}
function renderField() {
  fctx.setTransform(scale, 0, 0, scale, 0, 0);
  fctx.clearRect(0, 0, W, ROWS * C);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const t = G.grid[r * COLS + c];
    if (t) drawCell(c, r, t);
  }
}
function resize() {
  const maxW = window.innerWidth - 12, maxH = window.innerHeight - 12;
  const cssW = Math.floor(Math.min(maxW, maxH * W / H));
  const dpr = window.devicePixelRatio || 1;
  scale = cssW / W * dpr;
  cv.width = Math.round(W * scale); cv.height = Math.round(H * scale);
  cv.style.width = cssW + 'px'; cv.style.height = Math.round(cssW * H / W) + 'px';
  field.width = cv.width; field.height = Math.round(ROWS * C * scale);
  renderField();
}
window.addEventListener('resize', resize);

// ---------- level setup ----------
function buildLevel(n) {
  const g = G.grid;
  const shape = SHAPES[G.order[n % SHAPES.length]];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    let t;
    if (c < 2 || c >= COLS - 2 || r < 2 || r >= ROWS - 2) t = 2;
    else t = shape((c - 2) / 50, (r - 2) / 52) ? 1 : 0;
    g[r * COLS + c] = t;
  }
  // channels: each is a gap (default 4 wide) with 2-thick walls; diagonal ones shift 1 col per `step` rows above row `base`
  let T = G.tubes[n % G.tubes.length];
  const defs = T === 'twin' ? [{ L0: 14, top: 42, dir: 0 }, { L0: 36, top: 42, dir: 0 }]
    : T === 'diagL' ? [{ L0: 29, top: 34, dir: -1, base: 55, step: 5, w: 8 }]   // diagonal all the way
    : T === 'diagR' ? [{ L0: 21, top: 34, dir: 1, base: 55, step: 5, w: 8 }]
    : T === 'triple' ? [{ L0: 8, top: 42, dir: 0 }, { L0: 25, top: 42, dir: 0 }, { L0: 42, top: 42, dir: 0 }]
    : T === 'vee' ? [{ L0: 8, top: 34, dir: 1, base: 55, step: 5, w: 8 }, { L0: 38, top: 34, dir: -1, base: 55, step: 5, w: 8 }]
    : T === 'flare' ? [{ L0: 16, top: 34, dir: -1, base: 55, step: 5, w: 8 }, { L0: 30, top: 34, dir: 1, base: 55, step: 5, w: 8 }]
    : [{ L0: 25, top: TUBE_TOP, dir: 0 }];
  G.aim = []; G.cavs = []; G.assist = [];
  for (const d of defs) {
    for (let r = d.top; r < ROWS; r++) {
      const w = d.w || 4, gl = d.L0 + d.dir * Math.floor(Math.max(0, (d.base || 48) - r) / (d.step || 2));
      for (const c of [gl - 2, gl - 1, gl + w, gl + w + 1]) g[r * COLS + c] = 2;
      for (let c = gl; c < gl + w; c++) g[r * COLS + c] = 0;
    }
    const w2 = (d.w || 4) / 2, topC = d.L0 + d.dir * Math.floor(Math.max(0, (d.base || 48) - d.top) / (d.step || 2)) + w2;
    G.aim.push(OX + (d.L0 + w2) * C);
    G.assist.push({ x: OX + (d.L0 + w2) * C, ax: d.w ? d.dir / d.step : 0 });
    G.cavs.push([topC, d.top - 3]);
  }
  // cavity above each channel
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (g[r * COLS + c] === 1 && G.cavs.some(([cx, cy]) => (c + 0.5 - cx) ** 2 + (r + 0.5 - cy) ** 2 < 25)) g[r * COLS + c] = 0;
  }
  let b = 0; for (let i = 0; i < g.length; i++) if (g[i] === 1) b++;
  G.bricks = b;
  // orbs
  G.orbs = [];
  const want = 14 + Math.min(n, 6);
  // ball-increasing orbs go near the channel (front), the rest higher up
  const near = [], mid = [], far = [];
  for (let r = 6; r < 41; r++) for (let c = 6; c < COLS - 6; c++) if (g[r * COLS + c] === 1) {
    const dc = Math.min(...G.cavs.map(v => Math.abs(c - v[0])));
    (r >= 31 && dc < 15 ? near : r >= 22 && dc < 22 ? mid : far).push([c, r]);
  }
  const place = (lists, type) => {
    for (const list of lists) {
      for (let tries = 0; tries < 120 && list.length; tries++) {
        const [c, r] = list[(Math.random() * list.length) | 0];
        const x = OX + (c + 0.5) * C, y = OY + (r + 0.5) * C;
        if (G.orbs.every(o => Math.hypot(o.x - x, o.y - y) > 22)) { G.orbs.push({ x, y, type, ph: Math.random() * 6.28 }); return true; }
      }
    }
    return false;
  };
  const front = [near, mid, far], back = [far, mid, near];
  place(front, 'plus3'); place(front, 'plus3'); place(front, 'x2'); place(front, 'x3'); place(front, 'pierce');
  const BAG = ['plus3', 'plus3', 'plus5', 'x2', 'x2', 'x3', 'minus', 'wide', 'wide', 'bomb', 'bomb', 'pierce'];
  for (let i = 0, fails = 0; G.orbs.length < want && fails < 30; i++) {
    const type = BAG[(Math.random() * BAG.length) | 0];
    const up = type === 'plus3' || type === 'plus5' || type === 'x2' || type === 'x3';
    if (!place(up ? front : back, type)) fails++;
  }
  G.speed = Math.min(380, 250 * (1 + 0.04 * n));
  renderField();
}
const ORB = {
  plus3: { col: '#19d3e0', txt: '+3' },
  plus5: { col: '#3b82f6', txt: '+5' },
  x2: { col: '#9be22c', txt: '×2' },
  x3: { col: '#e6d21a', txt: '×3' },
  pierce: { col: '#a56bff', txt: '»' },
  minus: { col: ORANGE, txt: '−' },
  wide: { col: '#ff6fa8', txt: '▲' },
  bomb: { col: '#ffb020', txt: '★' }
};

function resetBall() {
  G.balls = [{ x: G.px, y: PADDLE_Y - PH / 2 - R - 1, vx: 0, vy: 0 }];
  G.state = 'ready';
}
function newGame() {
  G.level = 0; G.score = 0; G.lives = 3; G.pwTimer = 0; G.pierce = 0; G.pw = 56;
  G.parts.length = 0; G.texts.length = 0;
  G.order = SHAPES.map((_, i) => i).sort(() => Math.random() - 0.5);
  const kinds = ['center', 'twin', 'triple', 'diagL', 'diagR', 'vee', 'flare'];
  G.tubes = [];
  for (let i = 0; i < SHAPES.length; i++) {
    let k; do { k = kinds[(Math.random() * kinds.length) | 0]; } while (k === G.tubes[i - 1]);
    G.tubes.push(k);
  }
  // debug/preview: ?tube=<kind>  ?lv=N
  const q = new URLSearchParams(location.search), tq = q.get('tube'), lq = parseInt(q.get('lv'), 10);
  if (kinds.includes(tq)) G.tubes = G.tubes.map(() => tq);
  if (lq > 1) G.level = lq - 1;
  buildLevel(G.level); resetBall();
  addText(W / 2, OY + 100, 'LEVEL ' + (G.level + 1), '#fff', 22, 1.4);
}
function launch() {
  if (G.state !== 'ready') return;
  // aim the first shot at the nearest channel entrance
  const b = G.balls[0], tx = G.aim.reduce((m, x) => Math.abs(x - b.x) < Math.abs(m - b.x) ? x : m, G.aim[0]);
  const a = Math.atan2(tx - b.x, b.y - FIELD_BOTTOM) + (Math.random() - 0.5) * 0.04;
  b.vx = Math.sin(a) * G.speed; b.vy = -Math.cos(a) * G.speed;
  G.state = 'play'; G.hint = 0;
}

// ---------- effects ----------
function addText(x, y, text, color, size, life) {
  G.texts.push({ x, y, text, color, size, life, t: 0 });
}
function burst(x, y, color, n, spd) {
  for (let i = 0; i < n && G.parts.length < 2500; i++) {
    const a = Math.random() * 6.283, s = (0.3 + Math.random()) * spd;
    G.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 20, life: 0.4 + Math.random() * 0.5, t: 0, col: color, sz: 1 + Math.random() * 2 });
  }
}
function destroyCell(c, r) {
  const i = r * COLS + c;
  if (G.grid[i] !== 1) return;
  G.grid[i] = 0;
  fctx.setTransform(scale, 0, 0, scale, 0, 0);
  fctx.clearRect(c * C, r * C, C, C);
  G.bricks--; G.score++;
  const x = OX + (c + 0.5) * C, y = OY + (r + 0.5) * C;
  for (let k = 0; k < 2 && G.parts.length < 2500; k++) {
    G.parts.push({ x, y, vx: (Math.random() - 0.5) * 70, vy: -Math.random() * 60, life: 0.5 + Math.random() * 0.5, t: 0, col: Math.random() < 0.5 ? '#48b81d' : '#7be83a', sz: 2 + Math.random() * 1.5, g: 260 });
  }
  brickSound();
  if (G.shake < 1.2) G.shake += 0.1;
}

// ---------- orbs ----------
function spawnBalls(x, y, n) {
  popSound(n);
  for (let i = 0; i < n && G.balls.length < MAXB; i++) {
    const a = Math.random() * 6.283;
    G.balls.push({ x, y, vx: Math.cos(a) * G.speed, vy: Math.sin(a) * G.speed });
  }
}
function popOrb(o) {
  const i = G.orbs.indexOf(o); if (i < 0) return;
  G.orbs.splice(i, 1);
  const d = ORB[o.type];
  G.score += 50;
  burst(o.x, o.y, d.col, 24, 110);
  addText(o.x, o.y - 8, d.txt, d.col, 14, 0.9);
  switch (o.type) {
    case 'plus3': spawnBalls(o.x, o.y, 3); orbSound(true); break;
    case 'plus5': spawnBalls(o.x, o.y, 5); orbSound(true); break;
    case 'x2': case 'x3': {
      const k = o.type === 'x3' ? 2 : 1, cur = G.balls.slice();
      popSound(k + 2);
      for (const b of cur) {
        for (let j = 0; j < k && G.balls.length < MAXB; j++) {
          const a = Math.atan2(b.vy, b.vx) + (j % 2 ? 1 : -1) * (0.4 + Math.random() * 0.5);
          G.balls.push({ x: b.x, y: b.y, vx: Math.cos(a) * G.speed, vy: Math.sin(a) * G.speed });
        }
      }
      orbSound(true); break;
    }
    case 'pierce': G.pierce = 8; orbSound(true); tone(660, 0.3, 'triangle', 0.05, 2); break;
    case 'minus': G.pwKind = -1; G.pwTimer = 12; orbSound(false); break;
    case 'wide': G.pwKind = 1; G.pwTimer = 12; orbSound(true); break;
    case 'bomb': {
      const rad = 30;
      const c0 = Math.floor((o.x - rad - OX) / C), c1 = Math.floor((o.x + rad - OX) / C);
      const r0 = Math.floor((o.y - rad - OY) / C), r1 = Math.floor((o.y + rad - OY) / C);
      for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
        if (c < 0 || r < 0 || c >= COLS || r >= ROWS) continue;
        if (Math.hypot(OX + (c + 0.5) * C - o.x, OY + (r + 0.5) * C - o.y) < rad) destroyCell(c, r);
      }
      G.shake = 4; burst(o.x, o.y, '#ffd060', 40, 160);
      tone(90, 0.4, 'sawtooth', 0.1, 0.3);
      for (const q of G.orbs.slice()) if (Math.hypot(q.x - o.x, q.y - o.y) < rad) popOrb(q);
      break;
    }
  }
}

// ---------- ball physics ----------
function collideGrid(b) {
  for (let it = 0; it < 3; it++) {
    const g = G.grid;
    const c0 = Math.floor((b.x - R - OX) / C), c1 = Math.floor((b.x + R - OX) / C);
    const r0 = Math.floor((b.y - R - OY) / C), r1 = Math.floor((b.y + R - OY) / C);
    let best = -1, bd = 1e9, bnx = 0, bny = 0, bdist = 0, bc = 0, br = 0;
    for (let r = r0; r <= r1; r++) {
      if (r < 0 || r >= ROWS) continue;
      for (let c = c0; c <= c1; c++) {
        if (c < 0 || c >= COLS) continue;
        const t = g[r * COLS + c]; if (!t) continue;
        const rx = OX + c * C, ry = OY + r * C;
        const px = Math.max(rx, Math.min(b.x, rx + C)), py = Math.max(ry, Math.min(b.y, ry + C));
        const dx = b.x - px, dy = b.y - py, d2 = dx * dx + dy * dy;
        if (d2 < R * R && d2 < bd) {
          bd = d2; best = t; bc = c; br = r;
          if (d2 > 1e-6) { bdist = Math.sqrt(d2); bnx = dx / bdist; bny = dy / bdist; }
          else { bdist = 0; const m = Math.hypot(b.vx, b.vy) || 1; bnx = -b.vx / m; bny = -b.vy / m; }
        }
      }
    }
    if (best < 0) return;
    if (best === 2) wallSound();
    if (best === 1 && G.pierce > 0) { destroyCell(bc, br); continue; }
    const dot = b.vx * bnx + b.vy * bny;
    if (dot < 0) { b.vx -= 2 * dot * bnx; b.vy -= 2 * dot * bny; }
    b.x += bnx * (R - bdist + 0.01); b.y += bny * (R - bdist + 0.01);
    if (best === 1) destroyCell(bc, br);
    // keep speed constant and avoid endless flat trajectories
    let m = Math.hypot(b.vx, b.vy) || 1;
    b.vx = b.vx / m * G.speed; b.vy = b.vy / m * G.speed;
    const minV = G.speed * 0.18;
    if (Math.abs(b.vy) < minV) {
      b.vy = (b.vy < 0 ? -1 : 1) * minV;
      const s = Math.sqrt(G.speed * G.speed - b.vy * b.vy);
      b.vx = (b.vx < 0 ? -1 : 1) * s;
    }
  }
}
// gentle funnel: balls rising toward a channel get sucked onto its axis (toggle with the 🧲 button / F)
function funnel(b, dt) {
  if (b.vy >= 0 || b.y < FIELD_BOTTOM) return;
  let a = null;
  for (const q of G.assist) if (!a || Math.abs(b.x - q.x) < Math.abs(b.x - a.x)) a = q;
  if (!a || b.y - FIELD_BOTTOM > 150 || Math.abs(b.x - a.x) > 100) return;
  const ty = b.y - 40, tx = a.x + a.ax * (FIELD_BOTTOM - ty);
  const cur = Math.atan2(b.vx, -b.vy), want = Math.atan2(tx - b.x, b.y - ty);
  let d = want - cur;
  d = Math.atan2(Math.sin(d), Math.cos(d));
  const th = cur + Math.max(-4 * dt, Math.min(4 * dt, d));
  b.vx = Math.sin(th) * G.speed; b.vy = -Math.cos(th) * G.speed;
}
function stepBall(b, dt) {
  if (G.suction && G.assist.length) funnel(b, dt);
  const dist = G.speed * dt, n = Math.max(1, Math.ceil(dist / 1.2)), st = dt / n;
  for (let i = 0; i < n; i++) {
    b.x += b.vx * st; b.y += b.vy * st;
    if (b.y < FIELD_BOTTOM + R + 1) collideGrid(b);
    if (b.x < R) { b.x = R; b.vx = Math.abs(b.vx); wallSound(); }
    else if (b.x > W - R) { b.x = W - R; b.vx = -Math.abs(b.vx); wallSound(); }
    // paddle
    const half = G.pw / 2, top = PADDLE_Y - PH / 2;
    if (b.vy > 0 && b.y + R >= top && b.y - R <= PADDLE_Y + PH / 2 && Math.abs(b.x - G.px) <= half + R) {
      const t = Math.max(-1, Math.min(1, (b.x - G.px) / half)), a = t * 1.0;
      b.vx = Math.sin(a) * G.speed; b.vy = -Math.cos(a) * G.speed;
      b.y = top - R; G.bump = 1; paddleSound();
    }
    if (b.y - R > DEAD_Y) { b.dead = true; return; }
  }
}

// ---------- update ----------
function update(dt) {
  // paddle
  if (G.keys.l) G.target -= 420 * dt;
  if (G.keys.r) G.target += 420 * dt;
  G.target = Math.max(G.pw / 2 + 2, Math.min(W - G.pw / 2 - 2, G.target));
  G.px += (G.target - G.px) * (1 - Math.exp(-dt * 40));
  if (G.pwTimer > 0) {
    G.pwTimer -= dt;
    if (G.pwTimer <= 0) { G.pwKind = 0; G.pwTimer = 0; }
  }
  const wantW = G.pwKind > 0 ? 88 : G.pwKind < 0 ? 34 : 56;
  G.pw += (wantW - G.pw) * (1 - Math.exp(-dt * 12));
  G.bump = Math.max(0, G.bump - dt * 8);
  if (G.pierce > 0) G.pierce = Math.max(0, G.pierce - dt);
  G.shake = Math.max(0, G.shake - dt * 8);

  if (G.state === 'ready') {
    const b = G.balls[0]; b.x = G.px; b.y = PADDLE_Y - PH / 2 - R - 1;
  } else if (G.state === 'play' || G.state === 'clear') {
    for (const b of G.balls) stepBall(b, dt);
    // orbs
    for (const o of G.orbs.slice()) {
      for (const b of G.balls) {
        if (Math.hypot(b.x - o.x, b.y - o.y) < ORB_R + R) { popOrb(o); break; }
      }
    }
    const before = G.balls.length;
    G.balls = G.balls.filter(b => !b.dead);
    if (G.balls.length < before) dropSound();
    if (G.state === 'play') {
      if (G.bricks <= 0) {
        G.state = 'clear'; G.timer = 1.8; clearSound();
        addText(W / 2, OY + 110, 'CLEAR!', '#fff', 26, 1.8);
        G.shake = 2;
      } else if (G.balls.length === 0 && before > 0) {
        loseSound();
        G.lives--;
        if (G.lives <= 0) {
          G.state = 'over';
          if (G.score > G.best) { G.best = G.score; try { localStorage.setItem('sb-best', G.best); } catch (e) {} }
        } else {
          G.pwKind = 0; G.pwTimer = 0; G.pierce = 0;
          resetBall();
          addText(W / 2, OY + 110, 'MISS', ORANGE, 20, 1.0);
        }
      }
    } else {
      G.timer -= dt;
      if (G.timer <= 0) {
        G.level++; G.pwKind = 0; G.pwTimer = 0; G.pierce = 0;
        buildLevel(G.level); resetBall();
        addText(W / 2, OY + 100, 'LEVEL ' + (G.level + 1), '#fff', 22, 1.4);
      }
    }
  }
  // particles & texts
  for (let i = G.parts.length - 1; i >= 0; i--) {
    const p = G.parts[i]; p.t += dt;
    if (p.t >= p.life) { G.parts[i] = G.parts[G.parts.length - 1]; G.parts.pop(); continue; }
    p.vy += (p.g || 120) * dt; p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (let i = G.texts.length - 1; i >= 0; i--) {
    const t = G.texts[i]; t.t += dt; t.y -= 12 * dt;
    if (t.t >= t.life) G.texts.splice(i, 1);
  }
}

// ---------- drawing ----------
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
}
function draw(now) {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.fillStyle = '#161616'; ctx.fillRect(0, 0, W, H);
  // header
  ctx.fillStyle = '#343434'; ctx.fillRect(0, 0, W, OY - 4);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 11px ' + FONT; ctx.textBaseline = 'middle';
  ctx.textAlign = 'left'; ctx.fillText('SCORE ' + G.score, 10, 9);
  ctx.textAlign = 'center'; ctx.fillText('LV ' + (G.level + 1), W / 2, 9);
  if (G.pierce > 0) { ctx.fillStyle = '#c9a0ff'; ctx.textAlign = 'center'; ctx.fillText('PIERCE ' + G.pierce.toFixed(1), W * 0.72, 9); ctx.fillStyle = '#fff'; }
  ctx.textAlign = 'right'; ctx.fillText('♥'.repeat(Math.max(0, G.lives)), W - 10, 9);

  const sx = (Math.random() - 0.5) * G.shake, sy = (Math.random() - 0.5) * G.shake;
  ctx.save(); ctx.translate(sx, sy);
  ctx.drawImage(field, 0, 0, field.width, field.height, OX, OY, W, ROWS * C);

  // orbs
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const o of G.orbs) {
    const d = ORB[o.type], p = 1 + Math.sin(now / 250 + o.ph) * 0.06;
    ctx.fillStyle = d.col; ctx.beginPath(); ctx.arc(o.x, o.y, ORB_R * p, 0, 6.283); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 9px ' + FONT; ctx.fillText(d.txt, o.x, o.y + 0.5);
  }
  // particles
  for (const p of G.parts) {
    ctx.globalAlpha = 1 - p.t / p.life; ctx.fillStyle = p.col; ctx.fillRect(p.x, p.y, p.sz, p.sz);
  }
  ctx.globalAlpha = 1;
  // bottom line
  ctx.fillStyle = ORANGE; ctx.fillRect(0, DEAD_Y + 2, W, 6);
  // paddle
  const pw = G.pw, ph = PH + G.bump * 2;
  ctx.fillStyle = G.pwKind > 0 ? '#ff8fbf' : G.pwKind < 0 ? '#c9452b' : ORANGE;
  rrect(G.px - pw / 2, PADDLE_Y - ph / 2, pw, ph, 3); ctx.fill();
  // balls
  ctx.fillStyle = G.pierce > 0 ? '#e0c8ff' : '#fff'; ctx.beginPath();
  for (const b of G.balls) { ctx.moveTo(b.x + R, b.y); ctx.arc(b.x, b.y, R, 0, 6.283); }
  ctx.fill();
  // texts
  for (const t of G.texts) {
    ctx.globalAlpha = Math.min(1, (t.life - t.t) * 2.5);
    ctx.fillStyle = t.color; ctx.font = 'bold ' + t.size + 'px ' + FONT; ctx.textAlign = 'center';
    ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // overlays
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (G.state === 'ready' && G.hint) {
    ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.font = '12px ' + FONT;
    ctx.fillText('ドラッグでパドル移動 / タップで発射', W / 2, 395);
    ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.font = '10px ' + FONT;
    ctx.fillText('ボールは通路から上へ', W / 2, 412);
  }
  if (G.state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,.72)'; ctx.fillRect(0, 130, W, 150);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 26px ' + FONT; ctx.fillText('GAME OVER', W / 2, 168);
    ctx.font = '13px ' + FONT; ctx.fillText('SCORE ' + G.score + '   BEST ' + G.best, W / 2, 205);
    ctx.fillStyle = ORANGE; ctx.fillText('タップでリスタート', W / 2, 245);
  }
}

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  update(dt); draw(now);
  requestAnimationFrame(frame);
}

// ---------- input ----------
function pointerX(e) {
  const r = cv.getBoundingClientRect();
  return (e.clientX - r.left) / r.width * W;
}
cv.addEventListener('pointermove', e => { G.target = pointerX(e); });
cv.addEventListener('pointerdown', e => {
  initAudio();
  G.target = pointerX(e);
  if (G.state === 'ready') launch();
  else if (G.state === 'over') newGame();
});
['touchstart', 'click'].forEach(ev => window.addEventListener(ev, initAudio, { passive: true }));
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') G.keys.l = true;
  else if (e.key === 'ArrowRight' || e.key === 'd') G.keys.r = true;
  else if (e.key === ' ' || e.key === 'Enter') {
    initAudio(); e.preventDefault();
    if (G.state === 'ready') launch(); else if (G.state === 'over') newGame();
  } else if (e.key === 'm') toggleMute();
  else if (e.key === 'f') setSuction(!G.suction);
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') G.keys.l = false;
  else if (e.key === 'ArrowRight' || e.key === 'd') G.keys.r = false;
});
function setSuction(on) {
  G.suction = on; suckBtn.textContent = '🧲 吸引 ' + (on ? 'ON' : 'OFF'); suckBtn.classList.toggle('off', !on);
  try { localStorage.setItem('sb-suction', on ? '1' : '0'); } catch (e) {}
}
try { if (localStorage.getItem('sb-suction') === '0') setSuction(false); } catch (e) {}
suckBtn.addEventListener('pointerdown', e => { e.stopPropagation(); setSuction(!G.suction); });
function toggleMute() {
  muted = !muted; muteBtn.textContent = muted ? '🔇' : '🔊';
  try { localStorage.setItem('sb-muted', muted ? '1' : '0'); } catch (e) {}
}
muteBtn.addEventListener('pointerdown', e => { e.stopPropagation(); initAudio(); toggleMute(); });

resize();
newGame();
requestAnimationFrame(frame);
})();
</script>
</body>
